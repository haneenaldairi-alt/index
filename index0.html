const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.random()*a.length|0],on=(s,f)=>document.querySelectorAll(s).forEach(b=>b.onclick=()=>f(b));

{n:'Level 1',t:'School Subjects',e:'📚',b:'🏅 Subject Star',items:[

{t:'s',h:'🧩 Describing Words',html:`<div style="text-align:center"><div class="mascot">🦉</div><p>Some subjects are <b>easy</b>. Some are <b>difficult</b>. Which ones are <b>interesting</b>?</p></div>`+can(['Use a glossary or dictionary to find or check what a word means.','Ask and answer a question about something I heard using details from the spoken text.','Spot topic-specific words for a subject I am discussing or presenting.'])},
{t:'s',h:'📖 New Words',html:`<p>Use a dictionary to find the meaning. Then draw a picture that describes the word ✏️</p><div class="grid">${['easy','difficult','interesting','boring'].map(vc).join('')}</div>`},
{t:'s',h:'✏️ Write a sentence for each word',html:`${sen('The test is easy.')}${sen('The small dog is very easy to pet.')}${sen('Math is difficult.')}${sen('This math problem is very difficult to do.')}${sen('Cats are interesting.')}${sen('I think space is very interesting.')}${sen('This game is boring.')}${sen('Sitting in a long queue is very boring.')}`},
{t:'match',n:'Vocabulary Challenge',h:'🔗 Match the word to the picture',p:[['easy','😄'],['difficult','🪨'],['interesting','🐉'],['boring','🥱']]},
{t:'mem',n:'Memory Game',h:'🧠 Find the matching pairs',p:[['easy','😄'],['difficult','🪨'],['interesting','🐉'],['boring','🥱']]},
{t:'scr',n:'Word Puzzle',w:['easy','boring','difficult','interesting']},
{t:'mcq',n:'Guess the Picture',q:'Which word matches the picture?',big:'🥱',o:['interesting','boring','easy'],a:1},

{t:'s',h:'👦 Nasser',html:`<div class="txt"><div class="av">👦</div><div><p>My name is Nasser. I am in Grade 3. My favourite subject is science. I like science because it is interesting. It teaches us about the world and how it works. Science is easy for me. I do not like maths because it is difficult sometimes. My friend Ahmed likes social studies.</p><button class="btn o" data-say="My name is Nasser. I am in Grade 3. My favourite subject is science. I like science because it is interesting. It teaches us about the world and how it works. Science is easy for me. I do not like maths because it is difficult sometimes. My friend Ahmed likes social studies.">🔊 Read aloud</button></div></div><p class="ar">ناصر يحب العلوم لأنها ممتعة، ولا يحب الرياضيات لأنها صعبة أحياناً.</p>`},
{t:'s',h:'🧒 Ahmed',html:`<div class="txt"><div class="av">🧒</div><div><p>My name is Ahmed. My favourite subject is social studies. I like social studies because it is interesting. We learn about people and places. I also like Islamic studies. We learn stories and lessons about being kind and good to others. My sister, Hessa, likes CCDI.</p><button class="btn o" data-say="My name is Ahmed. My favourite subject is social studies. I like social studies because it is interesting. We learn about people and places. I also like Islamic studies. We learn stories and lessons about being kind and good to others. My sister, Hessa, likes CCDI.">🔊 Read aloud</button></div></div><p class="ar">أحمد يفضّل الدراسات الاجتماعية ويحب التربية الإسلامية، وأخته حصة تحب CCDI.</p>`},
{t:'s',h:'👧 Hessa',html:`<div class="txt"><div class="av">👧</div><div><p>My name is Hessa. My favourite subject is CCDI. I like CCDI because it is fun and interesting. I like drawing and making things on the computer. I like Islamic studies, but I do not like music much.</p><button class="btn o" data-say="My name is Hessa. My favourite subject is CCDI. I like CCDI because it is fun and interesting. I like drawing and making things on the computer. I like Islamic studies, but I do not like music much.">🔊 Read aloud</button></div></div><p class="ar">حصة تحب CCDI لأنها ممتعة، وتحب التربية الإسلامية، ولا تحب الموسيقى كثيراً.</p>`},
{t:'match',n:'Who likes what?',h:'🔗 Match the child to the favourite subject',p:[['Nasser','🔬 science'],['Ahmed','🌍 social studies'],['Hessa','🎨💻 CCDI']]},
{t:'mcq',n:'Fill in the Blanks',q:'Nasser likes science because it is ______.',o:['interesting','boring','music'],a:0},

const R={};
R.s=(it,el)=>{el.innerHTML=`<h2>${it.h}</h2>${it.html}`};
R.r=(it,el)=>{el.innerHTML=`<h2>${it.q}</h2><button class="btn o" id="rv">👁 Show answer</button><div class="ans" id="an" hidden>${it.a}</div>`;$('#rv').onclick=()=>{$('#an').hidden=false;win(1)}};
R.mcq=(it,el)=>{let t=0;el.innerHTML=`<h2>${it.q}</h2>${it.big?`<div class="big">${it.big}</div>`:''}${it.say?`<button class="btn o" data-say="${it.say}">🔊 Listen</button>`:''}<div class="grid">${it.o.map((o,k)=>`<button class="btn opt" data-k="${k}">${o}</button>`).join('')}</div>${S.teacher?'<button class="btn o" id="sa">👁 Show answer</button>':''}`;
const B=[...el.querySelectorAll('.opt')];B.forEach(b=>b.onclick=()=>{if(fin)return;if(+b.dataset.k==it.a){b.classList.add('ok');win(!t);fin=true;upd()}else{b.classList.add('bad');t=1}});
const sa=$('#sa');if(sa)sa.onclick=()=>B[it.a].classList.add('ok');if(it.say)say(it.say)};
R.match=(it,el)=>{let sel=null,n=0,w=0;const L=sh(it.p.map((p,k)=>[p[0],k])),Q=sh(it.p.map((p,k)=>[p[1],k]));
el.innerHTML=`<h2>${it.h}</h2><div class="cols"><div>${L.map(x=>`<button class="btn opt" data-s="l" data-k="${x[1]}">${x[0]}</button>`).join('')}</div><div>${Q.map(x=>`<button class="btn opt" data-s="r" data-k="${x[1]}">${x[0]}</button>`).join('')}</div></div>`;
el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.classList.contains('ok'))return;

if(!sel)return;if(sel.dataset.k==b.dataset.k){sel.classList.add('ok');b.classList.add('ok');sel.style.outline='';sel=null;if(++n==it.p.length){win(!w);fin=true;upd()}else tst('👍')}else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400);w=1}})};
R.mem=(it,el)=>{const c=sh(it.p.flatMap((p,k)=>[[p[0],k],[p[1],k]]));let o=[],m=0,w=0,lock=0;
el.innerHTML=`<h2>${it.h}</h2><div class="grid">${c.map((x,j)=>`<button class="btn" style="min-height:90px">❓</button>`).join('')}</div>`;
const B=[...el.querySelectorAll('.btn')];B.forEach((b,j)=>b.onclick=()=>{if(lock||b.dataset.f||o.includes(j))return;b.textContent=c[j][0];b.classList.add('opt');o.push(j);
if(o.length==2){const[x,y]=o;if(c[x][1]==c[y][1]){B[x].dataset.f=B[y].dataset.f=1;B[x].classList.add('ok');B[y].classList.add('ok');o=[];if(++m==it.p.length){win(w<3);fin=true;upd()}else tst('👍')}else{w++;lock=1;setTimeout(()=>{[x,y].forEach(z=>{B[z].textContent='❓';B[z].classList.remove('opt')});o=[];lock=0},900)}}})};
R.scr=(it,el)=>{let k=0;const nx=()=>{const W=it.w[k];let a='';
el.innerHTML=`<h2>Word Puzzle ${k+1}/${it.w.length}</h2><div class="big">${E[W][0]}</div><div class="slot" id="sl">…</div><div>${sh(W.split('')).map(c=>`<button class="btn">${c}</button>`).join('')}</div><button class="btn o" id="rr">↺ Reset</button>`;
const B=[...el.querySelectorAll('.btn:not(.o)')],sl=$('#sl');
B.forEach(b=>b.onclick=()=>{a+=b.textContent;b.disabled=true;sl.textContent=a;if(a.length==W.length){if(a==W){sl.classList.add('ok');say(W);win(1);k++;if(k<it.w.length)setTimeout(nx,1200);else{fin=true;upd()}}else{tst('Try again! 🔁');setTimeout(nx,700)}}});
$('#rr').onclick=nx};nx()};

R[it.t](it,$('#st'));$('#pv').onclick=()=>{if(i>0){i--;go()}};$('#rs').onclick=go;$('#nx').onclick=()=>{if(i<items.length-1){i++;go()}else onEnd()};upd();scrollTo(0,0)}

function home(){items=[];$('#app').innerHTML=`<div class="card" style="text-align:center"><div class="mascot">🦉</div><h1>English – Unit 1</h1><h2>Back to School 🎒</h2><p>“Hello, friends! Welcome back to school! Let’s learn and play together!”</p><button class="btn o big2" id="a">🚀 Start Learning</button><button class="btn big2" id="b">🎮 Let’s Play</button>${prog()}</div>`;$('#a').onclick=map;$('#b').onclick=play}
function map(){items=[];const op=k=>S.teacher||k==0||S.done.includes(k-1);
$('#app').innerHTML=`<div class="card"><h2>🗺️ Choose your adventure</h2>${prog()}<div class="grid">${LS.map((L,k)=>`<button class="btn lv ${op(k)?'':'lock'}" data-k="${k}"><span class="em">${L.e}</span>${L.n}<br><small>${L.t}</small>${S.done.includes(k)?' ✅':''}${op(k)?'':' 🔒'}</button>`).join('')}<button class="btn o lv ${S.teacher||S.done.length>=4?'':'lock'}" id="fn"><span class="em">🏆</span>Final Challenge</button></div>${S.teacher?`<div class="ans">👩‍🏫 <b>Class summary:</b> ⭐ ${S.stars} stars · Levels finished ${S.done.filter(k=>k<4).length}/4 · ${S.done.length?S.done.map(k=>k<4?LS[k].b:'🏆').join(' '):'no badges yet'}</div>`:''}</div>`;
on('.lv[data-k]',b=>{const k=+b.dataset.k;if(op(k)){items=LS[k].items;i=0;ttl=LS[k].n+': '+LS[k].t;onEnd=()=>lend(k);go()}});
$('#fn').onclick=()=>{if(!(S.teacher||S.done.length>=4)){tst('Finish all 4 levels first! 🔒');return}
const pool=LS.flatMap(L=>L.items.filter(x=>x.t=='mcq'));items=sh(pool).slice(0,10).map(x=>({...x,n:'Final Challenge'}));i=0;S.fs=0;ttl='🏆 Final Challenge';onEnd=res;go()}}
function play(){const all=LS.flatMap(L=>L.items.filter(x=>x.t!='s').map(x=>[L.n,x]));
$('#app').innerHTML=`<div class="card"><h2>🎮 Play Zone</h2><p>Pick any game!</p><div class="grid">${all.map((x,k)=>`<button class="btn ${x[1].t=='mcq'?'opt':''}" data-k="${k}">${x[1].n}<br><small>${x[0]}</small></button>`).join('')}</div></div>`;
on('[data-k]',b=>{items=[all[+b.dataset.k][1]];i=0;ttl='🎮 Play';onEnd=play;go()})}
function lend(k){if(!S.done.includes(k))S.done.push(k);fx('🏅 '+LS[k].b);
$('#app').innerHTML=`<div class="card" style="text-align:center"><div class="mascot">🏅</div><h1>${LS[k].b}</h1><h2>Excellent! ${LS[k].n} complete!</h2>${prog()}<button class="btn o big2" id="n1">${k<3?'Next Level ▶':'Final Challenge 🏆'}</button><button class="btn big2" id="n2">🗺️ Map</button></div>`;
$('#n2').onclick=map;$('#n1').onclick=()=>{if(k<3){items=LS[k+1].items;i=0;ttl=LS[k+1].n+': '+LS[k+1].t;onEnd=()=>lend(k+1);go()}else{map();$('#fn').click()}}}
function res(){if(!S.done.includes(4))S.done.push(4);const n=S.fs;fx('🏆');
$('#app').innerHTML=`<div class="card" style="text-align:center"><div class="mascot">${n>=9?'🏆':n>=6?'🌟':'💪'}</div><h1>${n} / 10</h1><h2>${n>=9?'Amazing! You are a Unit 1 Champion!':n>=6?'Well Done! Great work!':'Good try! Practise and play again!'}</h2><p style="font-size:2em">${'⭐'.repeat(Math.ceil(n/2))}</p>${prog()}<button class="btn o big2" id="n1">🔁 Play again</button><button class="btn big2" id="n2">🗺️ Map</button></div>`;
$('#n2').onclick=map;$('#n1').onclick=()=>{map();$('#fn').click()}}
$('#hm').onclick=home;$('#mp').onclick=map;
$('#tb').onclick=()=>{S.teacher=!S.teacher;document.body.classList.toggle('tm',S.teacher);$('#tb').classList.toggle('on',S.teacher);tst(S.teacher?'👩‍🏫 Teacher Mode ON':'Teacher Mode OFF');items.length?go():home()};
document.addEventListener('keydown',e=>{if(!S.teacher||!items.length)return;if(e.key=='ArrowRight')$('#nx')?.click();if(e.key=='ArrowLeft')$('#pv')?.click()});
home();
</script></body></html>
